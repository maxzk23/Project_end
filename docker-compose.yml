services:
  postgres:
    image: postgres:15-alpine
    container_name: lms-postgres-local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpassword123
      POSTGRES_DB: lms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lms_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms-web-app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:localpassword123@postgres:5432/lms_db
      - JWT_SECRET=lms-system-super-secret-key-2026-very-long
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./public/uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
